# One-click deploy on Render. The free plan is enough for a hackathon demo.
services:
  - type: web
    name: royal-knot
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: SEED_ON_START
        value: "0"
      # Uncomment and attach a Postgres instance for data that survives restarts.
